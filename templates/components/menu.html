{% set ep = request.endpoint %}
<ul class="navbar-nav ms-auto gap-lg-2">
    <li class="nav-item">
        <a class="nav-link {{ 'active' if ep == 'index' }}" href="{{ url_for('index') }}">Domů</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {{ 'active' if ep == 'main.index' }}" href="{{ url_for('main.index') }}">Pokédex</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {{ 'active' if ep == 'main.about' }}" href="{{ url_for('main.about') }}">O nás</a>
    </li>
        <li class="nav-item">
        <a class="nav-link {{ 'active' if ep == 'admin' }}" href="{{ url_for('admin') }}">Admin</a>
    </li>
    {% if session.get("uzivatel_id") is not none %}
    <li>
        <li class="nav-item">
        <a class="nav-link {{ 'active' if ep == 'auth.profil' }}" href="{{ url_for('auth.profil') }}">Profil</a>
    </li>
    {% else %}
    <li>
        <li class="nav-item">
        <a class="nav-link {{ 'active' if ep == 'auth.login' }}" href="{{ url_for('auth.login') }}">Přihlásit se</a>
    </li>
    {% endif %}
</ul>
